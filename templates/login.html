<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Log in • TradeMind V8</title>
  <style>
    :root{color-scheme:dark;--bg:#080d18;--panel:#101a2c;--line:#263751;--text:#f3f7ff;--muted:#9aabc4;--accent:#69e2bd;--blue:#75a7ff;--danger:#ff8e9a}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at top,#162743 0,#080d18 55%);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}
    .card{width:min(100%,440px);padding:30px;border:1px solid var(--line);border-radius:24px;background:rgba(16,26,44,.96);box-shadow:0 24px 80px #0007}.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.logo{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,var(--accent),var(--blue));color:#08131f;font-weight:900;font-size:20px}.brand strong{font-size:21px;letter-spacing:.2px}.brand small{display:block;color:var(--muted);margin-top:3px}.eyebrow{color:var(--accent);font-size:11px;letter-spacing:2px;font-weight:800}h1{font-size:30px;line-height:1.15;margin:8px 0}p{color:var(--muted);line-height:1.55}.field{margin:18px 0}.field label{display:block;font-size:13px;margin-bottom:8px;color:#dbe6f8}.field input{width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:12px;background:#0a1220;color:var(--text);font:inherit;outline:none}.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #69e2bd20}.button{width:100%;border:0;border-radius:12px;padding:15px;background:linear-gradient(100deg,var(--accent),#82d9ed);font-weight:800;font-size:15px;color:#07131c;cursor:pointer;margin-top:8px}.notice{border:1px solid #2d765f;background:#12382e;color:#baf5df;padding:12px;border-radius:11px;margin:14px 0;font-size:13px}.error{border-color:#84434b;background:#391d27;color:#ffc6cd}.foot{text-align:center;margin-top:22px;font-size:14px}.foot a,.small-link{color:var(--accent);text-decoration:none}.small-link{display:block;text-align:right;font-size:13px;margin-top:10px}.disclaimer{font-size:12px;text-align:center;margin-top:22px}
  </style>
</head>
<body><main class="card">
  <div class="brand"><div class="logo">TM</div><div><strong>TradeMind V8</strong><small>AI-assisted paper trading</small></div></div>
  <div class="eyebrow">WELCOME BACK</div><h1>Log in to your account</h1><p>Your private workspace, your own $1,000 paper portfolio.</p>
  {% if message %}<div class="notice">{{ message }}</div>{% endif %}{% if error %}<div class="notice error">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required minlength="8"></div>
    <button class="button" type="submit">Log in securely</button>
  </form>
  <div class="foot">New to TradeMind? <a href="/signup">Create an account</a></div>
  <p class="disclaimer">PAPER MODE ONLY • REAL-MONEY ORDERS DISABLED</p>
</main></body></html>
